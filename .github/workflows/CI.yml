name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # a prerelease failure shows on its job but does not fail the workflow (prereleases
    # have compiler bugs, e.g. JuliaLang/julia#64250 in 1.14.0-alpha2)
    continue-on-error: ${{ matrix.version == 'pre' }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # 1.12 is the oldest: SymJ comes from GitHub through [sources]
          - '1.12'
          - '1.13'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          # the latest release on Windows and macOS (macos-latest runners are Apple silicon)
          - version: '1'
            os: windows-latest
            arch: x64
          - version: '1'
            os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # (also keeps the scratch space, so the OSR rule data is not downloaded every run)
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # the tests download the OSR Integration rules from GitHub on first use; a copy the
      # cache brought back is downloaded again when OSR's main has moved on (without this,
      # CI tested the rules of the first cached run)
      - name: Refresh the OSR rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          depot="${JULIA_DEPOT_PATH%%[:;]*}"
          d="${depot:-$HOME/.julia}/scratchspaces/e79e1aeb-f1e6-4c79-b7b9-f0872eb2a392/integration/main"
          remote=$(curl -fsSL -H "Accept: application/vnd.github.sha" -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/OpenSymbolicRules/Integration/commits/main || true)
          cached=$(cat "$d/.symjosr-sha" 2>/dev/null || true)
          echo "OSR main: ${remote:-unknown}; cached: ${cached:-none}"
          if [ -n "$remote" ] && [ "$remote" != "$cached" ]; then rm -rf "$d"; echo "stale copy removed"; fi
      - uses: julia-actions/julia-runtest@v1
        with:
          # no coverage on 1.12, as in SymJ: precompiling SymJ for the coverage
          # configuration takes over an hour there (fine without it, and with it on 1.13)
          coverage: ${{ matrix.version != '1.12' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version != '1.12'
      - uses: codecov/codecov-action@v7
        if: matrix.version != '1.12'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
